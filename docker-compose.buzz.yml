# Buzz overlay — join shared adh_local. Usage: make buzz-up
services:
  buzz:
    build:
      context: ../adh
      dockerfile: Dockerfile
    container_name: adh-buzz
    networks:
      - adh_local
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      APP_ENVIRONMENT: development
      APP_RELOAD: "false"
      APP_LOG_LEVEL: INFO
      APP_LOG_FORMAT: text
      APP_LOG_TO_CONSOLE: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-adh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adh}
      POSTGRES_DB: buzz
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PREFIX: "adh_buzz:"
      JWT_ALGORITHM: HS256
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-adh-local-jwt}
      JWT_ISSUER: adh
      JWT_AUDIENCE: drivestream
      BUZZ_HEARTBEAT_SECONDS: "90"
      BUZZ_SEED_ON_START: "true"
      BUZZ_PUBLISH_SYSTEM_HEARTBEAT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  buzz-ui:
    build:
      context: ../adh/apps/buzz-desktop
      dockerfile: Dockerfile
    container_name: adh-buzz-ui
    networks:
      - adh_local
    ports:
      - "8081:80"
    depends_on:
      buzz:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    restart: unless-stopped

networks:
  adh_local:
    name: adh_local
    external: true
