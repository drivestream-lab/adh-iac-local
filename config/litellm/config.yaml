# ADH LiteLLM — OpenRouter via config aliases + Admin UI (/ui).
# Client names: glm, qwen, kimi-k3. Provider key is OPENROUTER_API_KEY (local .env).
# Host: http://localhost:4000  |  UI: http://localhost:4000/ui
# In-compose: apps call http://litellm:8000/v1 (container port 8000).

model_list:
  - model_name: glm
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: qwen
    litellm_params:
      model: openrouter/qwen/qwen3.8-max-0902
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: kimi-k3
    litellm_params:
      model: openrouter/moonshotai/kimi-k3
      api_key: os.environ/OPENROUTER_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  user_api_key_cache_ttl: 300

litellm_settings:
  request_timeout: 120
  force_ipv4: true
  drop_params: true
  num_workers: 4
  retry_after_timeout: true
  enable_redis_auth_cache: true
  cache: os.environ/REDIS_ENABLED
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    namespace: adh.litellm.cache
    ttl: os.environ/CACHE_TTL
    supported_call_types: ["acompletion", "aembedding"]
