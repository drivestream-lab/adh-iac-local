# ADH LiteLLM — UI-first (same pattern as autrio10x/iac-local).
# Models and provider credentials live in Postgres via Admin UI (/ui).
# This file is proxy/infra only. See config/litellm/README.md.
# Host: http://localhost:4000  |  UI: http://localhost:4000/ui
# In-compose: apps call http://litellm:8000/v1 (container port 8000).

model_list: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  user_api_key_cache_ttl: 300

litellm_settings:
  request_timeout: 120
  force_ipv4: true
  drop_params: true
  num_workers: 4
  retry_after_timeout: true
  enable_redis_auth_cache: true
  cache: os.environ/REDIS_ENABLED
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    namespace: adh.litellm.cache
    ttl: os.environ/CACHE_TTL
    supported_call_types: ["acompletion", "aembedding"]
